<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>邀请函模版编辑器</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --line: #d6dbe1;
        --text: #20262d;
        --muted: #68717d;
        --accent: #176b87;
        --soft: #e9f3f6;
        --danger: #a83232;
        --ok: #1f7a4d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        min-height: 100vh;
      }

      .stage {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-width: 0;
      }

      .topbar,
      .side {
        background: var(--panel);
        border-color: var(--line);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 64px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .template-name {
        color: var(--muted);
        font-size: 13px;
      }

      .canvas-wrap {
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 0;
        padding: 18px;
      }

      canvas {
        max-width: 100%;
        max-height: calc(100vh - 100px);
        background: #ffffff;
        border: 1px solid var(--line);
        touch-action: none;
      }

      .side {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 18px;
        border-left: 1px solid var(--line);
        overflow: auto;
      }

      .group {
        display: grid;
        gap: 10px;
      }

      .group-title {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select,
      button {
        min-height: 36px;
        border-radius: 6px;
        font: inherit;
      }

      input,
      select {
        width: 100%;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        padding: 6px 9px;
      }

      input[type="color"] {
        padding: 2px;
      }

      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .icon-control-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .mode-button {
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--muted);
      }

      .mode-button.active {
        border-color: var(--accent);
        background: var(--soft);
        color: var(--accent);
      }

      .icon-control {
        display: grid;
        gap: 6px;
      }

      .icon-control-title {
        color: var(--muted);
        font-size: 12px;
      }

      .icon-segment {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        min-height: 36px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
      }

      .icon-option {
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 34px;
        border: 0;
        border-right: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        padding: 0;
      }

      .icon-option:last-child {
        border-right: 0;
      }

      .icon-option.active {
        background: var(--soft);
        color: var(--accent);
      }

      .icon-option svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      button {
        border: 0;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font-weight: 650;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status {
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .status.error {
        color: var(--danger);
      }

      .status.ok {
        color: var(--ok);
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .side {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="stage">
        <header class="topbar">
          <div>
            <h1>邀请函模版编辑器</h1>
            <div class="template-name" id="templateName"></div>
          </div>
          <button id="saveBtn" type="button" disabled>保存</button>
        </header>
        <div class="canvas-wrap">
          <canvas id="canvas" width="960" height="540"></canvas>
        </div>
      </section>

      <aside class="side">
        <section class="group">
          <p class="group-title">模版</p>
          <div class="mode-switch" role="tablist" aria-label="模版操作">
            <button id="newTemplateBtn" class="mode-button active" type="button">新增模版</button>
            <button id="existingTemplateBtn" class="mode-button" type="button">选择已有</button>
          </div>
          <label id="templateSelectLabel" hidden>
            已上传模版
            <select id="templateSelect">
              <option value="">请选择模版</option>
            </select>
          </label>
          <label>
            模版名称
            <input id="templateNameInput" type="text" maxlength="64" />
          </label>
        </section>

        <section class="group">
          <p class="group-title">图片</p>
          <label>
            模版图片
            <input id="imageInput" type="file" accept="image/*" />
          </label>
        </section>

        <section class="group">
          <p class="group-title">文字样式</p>
          <div class="grid2">
            <label>
              字号
              <input id="fontSizeInput" type="number" min="8" step="1" value="48" />
            </label>
            <label>
              颜色
              <input id="colorInput" type="color" value="#000000" />
            </label>
          </div>
          <label>
            字体
            <select id="fontInput"></select>
          </label>
          <div class="icon-control-grid">
            <div class="icon-control">
              <span class="icon-control-title">水平</span>
              <div class="icon-segment" id="alignControl">
                <button class="icon-option" type="button" data-value="left" title="左对齐" aria-label="左对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16" />
                    <path d="M4 10h10" />
                    <path d="M4 14h16" />
                    <path d="M4 18h10" />
                  </svg>
                </button>
                <button class="icon-option active" type="button" data-value="center" title="居中对齐" aria-label="居中对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16" />
                    <path d="M7 10h10" />
                    <path d="M4 14h16" />
                    <path d="M7 18h10" />
                  </svg>
                </button>
                <button class="icon-option" type="button" data-value="right" title="右对齐" aria-label="右对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16" />
                    <path d="M10 10h10" />
                    <path d="M4 14h16" />
                    <path d="M10 18h10" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="icon-control">
              <span class="icon-control-title">垂直</span>
              <div class="icon-segment" id="valignControl">
                <button class="icon-option" type="button" data-value="top" title="顶部对齐" aria-label="顶部对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 5h14" />
                    <path d="M8 9h8" />
                    <path d="M7 13h10" />
                    <path d="M9 17h6" />
                  </svg>
                </button>
                <button class="icon-option active" type="button" data-value="middle" title="垂直居中" aria-label="垂直居中">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 5h14" />
                    <path d="M8 9h8" />
                    <path d="M7 12h10" />
                    <path d="M8 15h8" />
                    <path d="M5 19h14" />
                  </svg>
                </button>
                <button class="icon-option" type="button" data-value="bottom" title="底部对齐" aria-label="底部对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 7h6" />
                    <path d="M7 11h10" />
                    <path d="M8 15h8" />
                    <path d="M5 19h14" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>

        <div id="status" class="status"></div>
      </aside>
    </main>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const parentHash = (() => {
        try {
          return window.parent?.location?.hash || "";
        } catch {
          return "";
        }
      })();
      const parentHashQuery = parentHash.includes("?")
        ? parentHash.slice(parentHash.indexOf("?") + 1)
        : "";
      const routeParams = new URLSearchParams(parentHashQuery);
      const task = urlParams.get("task") || routeParams.get("task") || "";
      const initialTemplateName =
        urlParams.get("name") || routeParams.get("name") || "";

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const imageInput = document.getElementById("imageInput");
      const saveBtn = document.getElementById("saveBtn");
      const statusEl = document.getElementById("status");
      const templateSelect = document.getElementById("templateSelect");
      const templateSelectLabel = document.getElementById("templateSelectLabel");
      const templateNameEl = document.getElementById("templateName");
      const templateNameInput = document.getElementById("templateNameInput");
      const newTemplateBtn = document.getElementById("newTemplateBtn");
      const existingTemplateBtn = document.getElementById("existingTemplateBtn");
      const alignControl = document.getElementById("alignControl");
      const valignControl = document.getElementById("valignControl");

      const fontOptions = [
        {
          value: "",
          label: "默认字体",
          css: "system-ui, sans-serif",
        },
        {
          value: "microsoft_yahei",
          label: "微软雅黑",
          css: '"Microsoft YaHei", "微软雅黑", sans-serif',
        },
        {
          value: "simhei",
          label: "黑体",
          css: "SimHei, 黑体, sans-serif",
        },
        {
          value: "simsun",
          label: "宋体",
          css: "SimSun, 宋体, serif",
        },
        {
          value: "pingfang",
          label: "苹方",
          css: '"PingFang SC", "Hiragino Sans GB", sans-serif',
        },
        {
          value: "noto_sans_cjk",
          label: "思源黑体",
          css: '"Noto Sans CJK SC", "Source Han Sans SC", sans-serif',
        },
        {
          value: "dejavu_sans",
          label: "DejaVu Sans",
          css: '"DejaVu Sans", sans-serif',
        },
      ];

      const inputs = {
        fontsize: document.getElementById("fontSizeInput"),
        color: document.getElementById("colorInput"),
        font: document.getElementById("fontInput"),
      };

      let imageFile = null;
      let bitmap = null;
      let scale = 1;
      let rect = { x: 96, y: 220, w: 768, h: 96 };
      let fontSize = 48;
      let rotation = 0;
      let selected = false;
      let dragMode = "";
      let dragStart = null;
      let textAlign = "center";
      let textValign = "middle";
      let templateMode = "new";
      let currentImageDataUrl = "";
      let templateDetails = {};
      const previewText = "Name preview";

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.className = `status ${kind || ""}`.trim();
      }

      function currentTemplateName() {
        return templateNameInput.value.trim();
      }

      function updateTemplateTitle() {
        templateNameEl.textContent = currentTemplateName()
          ? currentTemplateName()
          : "Unnamed template";
      }

      function currentFontOption() {
        return (
          fontOptions.find((option) => option.value === inputs.font.value) ||
          fontOptions[0]
        );
      }

      function currentFontValue() {
        return inputs.font.value;
      }

      function updateSaveState() {
        saveBtn.disabled =
          (!imageFile && !currentImageDataUrl) || !currentTemplateName();
      }

      function imageBounds() {
        return {
          width: bitmap?.width || Math.max(1, canvas.width / scale),
          height: bitmap?.height || Math.max(1, canvas.height / scale),
        };
      }

      function clampRect() {
        const bounds = imageBounds();
        rect.w = Math.min(Math.max(1, rect.w), bounds.width);
        rect.h = Math.min(Math.max(1, rect.h), bounds.height);
        rect.x = Math.min(
          Math.max(0, rect.x),
          Math.max(0, bounds.width - rect.w),
        );
        rect.y = Math.min(
          Math.max(0, rect.y),
          Math.max(0, bounds.height - rect.h),
        );
      }

      function wrapText(text, maxWidth, measure) {
        const lines = [];
        for (const paragraph of text.split(/\r?\n/)) {
          let line = "";
          const tokens = paragraph.match(/[A-Za-z0-9]+(?:['-][A-Za-z0-9]+)*[ \t]*|[^\r\n]/gu) || [];
          for (let token of tokens) {
            if (measure(line + token) <= maxWidth) {
              line += token;
              continue;
            }
            if (line) {
              lines.push(line.trimEnd());
              line = "";
            }
            token = token.trimStart();
            if (measure(token.trimEnd()) <= maxWidth) {
              line = token;
              continue;
            }
            for (const character of Array.from(token.trimEnd())) {
              if (line && measure(line + character) > maxWidth) {
                lines.push(line.trimEnd());
                line = "";
              }
              line += character;
            }
          }
          lines.push(line.trimEnd());
        }
        return lines;
      }

      function textSize(size = fontSize, width = rect.w) {
        ctx.save();
        ctx.font = `${size * scale}px ${currentFontOption().css}`;
        const metrics = ctx.measureText(previewText);
        const lines = wrapText(
          previewText,
          width * scale,
          (value) => ctx.measureText(value).width,
        );
        ctx.restore();
        const ascent = (metrics.actualBoundingBoxAscent || size * scale * 0.8) / scale;
        const descent = (metrics.actualBoundingBoxDescent || size * scale * 0.2) / scale;
        const lineHeight = size * 1.2;
        return {
          w: metrics.width / scale,
          h: ascent + descent + (lines.length - 1) * lineHeight + size / 6,
          ascent,
          descent,
          lineHeight,
          lines,
        };
      }

      function fitTextHeight(keepCenter = true) {
        const height = Math.max(1, textSize().h);
        if (keepCenter) {
          rect.y += (rect.h - height) / 2;
        }
        rect.h = height;
        clampRect();
      }

      function rotateVector(x, y, angle = rotation) {
        const radians = (angle * Math.PI) / 180;
        return {
          x: x * Math.cos(radians) - y * Math.sin(radians),
          y: x * Math.sin(radians) + y * Math.cos(radians),
        };
      }

      function localPoint(point) {
        const center = { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 };
        const offset = rotateVector(point.x - center.x, point.y - center.y, -rotation);
        return { x: center.x + offset.x, y: center.y + offset.y };
      }

      function handleAt(point) {
        const local = localPoint(point);
        const radius = 9 / scale;
        const handles = {
          nw: [rect.x, rect.y],
          ne: [rect.x + rect.w, rect.y],
          se: [rect.x + rect.w, rect.y + rect.h],
          sw: [rect.x, rect.y + rect.h],
          left: [rect.x, rect.y + rect.h / 2],
          right: [rect.x + rect.w, rect.y + rect.h / 2],
        };
        if (selected &&
            Math.hypot(local.x - rect.x - rect.w / 2, local.y - rect.y - rect.h - 28 / scale) <= radius) {
          return "rotate";
        }
        for (const [name, [x, y]] of Object.entries(handles)) {
          if (Math.hypot(local.x - x, local.y - y) <= radius) {
            return name;
          }
        }
        return "";
      }

      function fitCanvas(width, height) {
        const maxWidth = Math.max(
          320,
          window.innerWidth - (window.innerWidth > 900 ? 420 : 36),
        );
        const maxHeight = Math.max(260, window.innerHeight - 104);
        scale = Math.min(maxWidth / width, maxHeight / height, 1);
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
      }

      function drawTextPreview() {
        const layout = textSize();
        const previewFontSize = fontSize * scale;
        const x = rect.x * scale;
        const y = rect.y * scale;
        const w = rect.w * scale;
        const h = rect.h * scale;
        const fontOption = currentFontOption();
        ctx.save();
        ctx.font = `${previewFontSize}px ${fontOption.css}`;
        ctx.fillStyle = inputs.color.value || "#000000";
        ctx.textBaseline = "alphabetic";
        ctx.textAlign = textAlign;
        const textX =
          textAlign === "center"
            ? x + w / 2
            : textAlign === "right"
              ? x + w
              : x;
        const padding = previewFontSize / 12;
        const contentHeight =
          (layout.ascent + layout.descent +
            (layout.lines.length - 1) * layout.lineHeight) * scale;
        const extra = Math.max(0, h - contentHeight - padding * 2);
        const offset =
          textValign === "bottom" ? extra : textValign === "middle" ? extra / 2 : 0;
        const firstY = y + padding + offset + layout.ascent * scale;
        layout.lines.forEach((line, index) => {
          ctx.fillText(line, textX, firstY + index * layout.lineHeight * scale);
        });
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (bitmap) {
          ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        const x = rect.x * scale;
        const y = rect.y * scale;
        const w = rect.w * scale;
        const h = rect.h * scale;
        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.translate(-x - w / 2, -y - h / 2);
        ctx.strokeStyle = "#176b87";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 5]);
        ctx.strokeRect(x, y, w, h);
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(23, 107, 135, 0.12)";
        ctx.fillRect(x, y, w, h);
        drawTextPreview();
        ctx.setLineDash([]);
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#176b87";
        ctx.lineWidth = 2;
        for (const [hx, hy] of [
          [x, y], [x + w, y], [x + w, y + h], [x, y + h],
        ]) {
          ctx.beginPath();
          ctx.arc(hx, hy, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        for (const [hx, hy, hw, hh] of [
          [x - 4, y + h / 2 - 9, 8, 18],
          [x + w - 4, y + h / 2 - 9, 8, 18],
        ]) {
          ctx.fillRect(hx, hy, hw, hh);
          ctx.strokeRect(hx, hy, hw, hh);
        }
        if (selected) {
          const handleY = y + h + 28;
          ctx.beginPath();
          ctx.moveTo(x + w / 2, y + h);
          ctx.lineTo(x + w / 2, handleY - 10);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x + w / 2, handleY, 9, -Math.PI * 0.75, Math.PI * 0.65);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x + w / 2 - 6, handleY + 7);
          ctx.lineTo(x + w / 2 - 2, handleY + 11);
          ctx.lineTo(x + w / 2 - 1, handleY + 4);
          ctx.stroke();
        }
        ctx.restore();
      }

      function canvasPoint(event) {
        const box = canvas.getBoundingClientRect();
        return {
          x:
            ((event.clientX - box.left - canvas.clientLeft) * canvas.width) /
            canvas.clientWidth /
            scale,
          y:
            ((event.clientY - box.top - canvas.clientTop) * canvas.height) /
            canvas.clientHeight /
            scale,
        };
      }

      function inRect(point) {
        point = localPoint(point);
        return (
          point.x >= rect.x &&
          point.x <= rect.x + rect.w &&
          point.y >= rect.y &&
          point.y <= rect.y + rect.h
        );
      }

      function selectFont(value) {
        inputs.font.value = value;
        draw();
      }

      async function loadTemplateDetail(name) {
        const detail = templateDetails[name];
        if (!detail) {
          return;
        }
        imageFile = null;
        imageInput.value = "";
        currentImageDataUrl = detail.background || "";
        if (currentImageDataUrl) {
          const response = await fetch(currentImageDataUrl);
          const blob = await response.blob();
          bitmap = await createImageBitmap(blob);
          fitCanvas(bitmap.width, bitmap.height);
        }
        const layer = detail.layer || {};
        rect = {
          x: Number(layer.x) || 0,
          y: Number(layer.y) || 0,
          w: Number(layer.w) || Math.max(1, detail.width || canvas.width),
          h: Number(layer.h) || Math.max(1, detail.height || canvas.height),
        };
        fontSize = Math.max(8, Number(layer.fontsize) || 48);
        rotation = Number(layer.rotation) || 0;
        selected = false;
        inputs.fontsize.value = Math.round(fontSize);
        inputs.color.value = layer.color || "#000000";
        selectFont(layer.font || "");
        textAlign = layer.align || "center";
        textValign = layer.valign || "middle";
        setIconControlValue(alignControl, textAlign);
        setIconControlValue(valignControl, textValign);
        fitTextHeight();
        draw();
        updateSaveState();
      }

      function initFontControls() {
        inputs.font.innerHTML = "";
        fontOptions.forEach((option) => {
          const selectOption = document.createElement("option");
          selectOption.value = option.value;
          selectOption.textContent = option.label;
          inputs.font.appendChild(selectOption);
        });
        selectFont("");
      }

      function setTemplateMode(mode) {
        templateMode = mode;
        const isExisting = templateMode === "existing";
        newTemplateBtn.classList.toggle("active", !isExisting);
        existingTemplateBtn.classList.toggle("active", isExisting);
        templateSelectLabel.hidden = !isExisting;
        templateNameInput.readOnly = isExisting;
        if (isExisting) {
          templateNameInput.value = templateSelect.value || "";
        } else if (
          templateSelect.value &&
          templateNameInput.value === templateSelect.value
        ) {
          templateSelect.value = "";
          templateNameInput.value = initialTemplateName || "";
          if (!imageFile) {
            currentImageDataUrl = "";
          }
        }
        updateTemplateTitle();
        updateSaveState();
      }

      function setIconControlValue(control, value) {
        [...control.querySelectorAll(".icon-option")].forEach((button) => {
          button.classList.toggle("active", button.dataset.value === value);
        });
      }

      function initIconControls() {
        alignControl.addEventListener("click", (event) => {
          const button = event.target.closest(".icon-option");
          if (!button) {
            return;
          }
          textAlign = button.dataset.value || "center";
          setIconControlValue(alignControl, textAlign);
          draw();
        });
        valignControl.addEventListener("click", (event) => {
          const button = event.target.closest(".icon-option");
          if (!button) {
            return;
          }
          textValign = button.dataset.value || "middle";
          setIconControlValue(valignControl, textValign);
          draw();
        });
        setIconControlValue(alignControl, textAlign);
        setIconControlValue(valignControl, textValign);
      }

      async function getPluginBridge() {
        if (window.AstrBotPluginPage) {
          await window.AstrBotPluginPage.ready();
          return window.AstrBotPluginPage;
        }
        if (window.parent === window) {
          return null;
        }
        for (let index = 0; index < 20; index += 1) {
          await new Promise((resolve) => setTimeout(resolve, 100));
          if (window.AstrBotPluginPage) {
            await window.AstrBotPluginPage.ready();
            return window.AstrBotPluginPage;
          }
        }
        return null;
      }

      async function pluginApiGet(endpoint, params) {
        const bridge = await getPluginBridge();
        if (bridge) {
          return bridge.apiGet(endpoint, params);
        }
        const query = new URLSearchParams();
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value !== null && value !== undefined && value !== "") {
            query.set(key, String(value));
          }
        });
        const suffix = query.toString() ? `?${query.toString()}` : "";
        const response = await fetch(
          `/api/plug/astrbot_plugin_customized_invitation/${endpoint}${suffix}`,
        );
        const data = await response.json();
        if (!response.ok || data.status === "error") {
          throw new Error(data.message || "Request failed.");
        }
        return data;
      }

      async function pluginApiPost(endpoint, body) {
        const bridge = await getPluginBridge();
        if (bridge) {
          return bridge.apiPost(endpoint, body);
        }
        const response = await fetch(
          `/api/plug/astrbot_plugin_customized_invitation/${endpoint}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          },
        );
        const data = await response.json();
        if (!response.ok || data.status === "error") {
          throw new Error(data.message || "Request failed.");
        }
        return data;
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("Failed to read image."));
          reader.readAsDataURL(file);
        });
      }

      async function loadTemplates() {
        templateNameInput.value = initialTemplateName;
        updateTemplateTitle();
        updateSaveState();

        try {
          const data = await pluginApiGet("editor/templates", { task });
          if (data.status === "error") {
            throw new Error(data.message || "Failed to load templates.");
          }
          templateDetails = data.templates || {};

          const names = [
            ...(data.user_templates || []),
            ...(data.global_templates || []),
          ];
          [...new Set(names)].forEach((name) => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            templateSelect.appendChild(option);
          });

          const currentName = data.current || initialTemplateName;
          if (currentName) {
            templateNameInput.value = currentName;
            templateSelect.value = currentName;
            if (templateSelect.value) {
              setTemplateMode("existing");
              await loadTemplateDetail(currentName);
            }
          }
          updateTemplateTitle();
          updateSaveState();
        } catch (error) {
          setStatus(error.message || "Failed to load templates.", "error");
        }
      }

      templateSelect.addEventListener("change", async () => {
        if (templateMode === "existing") {
          templateNameInput.value = templateSelect.value || "";
          if (templateSelect.value) {
            await loadTemplateDetail(templateSelect.value);
          }
        }
        updateTemplateTitle();
        updateSaveState();
      });

      templateNameInput.addEventListener("input", () => {
        if (templateMode === "new") {
          templateSelect.value = "";
        }
        updateTemplateTitle();
        updateSaveState();
      });

      newTemplateBtn.addEventListener("click", () => setTemplateMode("new"));
      existingTemplateBtn.addEventListener("click", () =>
        setTemplateMode("existing"),
      );

      imageInput.addEventListener("change", async () => {
        imageFile = imageInput.files?.[0] || null;
        if (!imageFile) {
          updateSaveState();
          return;
        }
        currentImageDataUrl = "";
        bitmap = await createImageBitmap(imageFile);
        fitCanvas(bitmap.width, bitmap.height);
        fontSize = Math.max(32, Math.round(bitmap.height / 12));
        const initialSize = textSize(fontSize, bitmap.width);
        const boxWidth = Math.min(bitmap.width, Math.ceil(initialSize.w + fontSize / 3));
        rect = {
          x: Math.round((bitmap.width - boxWidth) / 2),
          y: Math.round(bitmap.height * 0.45),
          w: boxWidth,
          h: textSize(fontSize, boxWidth).h,
        };
        rotation = 0;
        selected = false;
        inputs.fontsize.value = fontSize;
        clampRect();
        draw();
        updateSaveState();
        setStatus("");
      });

      inputs.fontsize.addEventListener("input", () => {
        fontSize = Math.max(8, Number(inputs.fontsize.value) || 48);
        fitTextHeight();
        draw();
      });
      inputs.color.addEventListener("input", draw);
      inputs.font.addEventListener("change", () => {
        fitTextHeight();
        draw();
      });

      function rectFromAnchor(start, anchorX, anchorY, width, height) {
        const center = {
          x: start.x + start.w / 2,
          y: start.y + start.h / 2,
        };
        const fixed = rotateVector(
          (anchorX - 0.5) * start.w,
          (anchorY - 0.5) * start.h,
          dragStart.rotation,
        );
        const anchorGlobal = { x: center.x + fixed.x, y: center.y + fixed.y };
        const newOffset = rotateVector(
          (anchorX - 0.5) * width,
          (anchorY - 0.5) * height,
          dragStart.rotation,
        );
        return {
          x: anchorGlobal.x - newOffset.x - width / 2,
          y: anchorGlobal.y - newOffset.y - height / 2,
          w: width,
          h: height,
        };
      }

      function fitsImage(candidate) {
        const bounds = imageBounds();
        const centerX = candidate.x + candidate.w / 2;
        const centerY = candidate.y + candidate.h / 2;
        const radians = (rotation * Math.PI) / 180;
        const extentX =
          (Math.abs(Math.cos(radians)) * candidate.w +
            Math.abs(Math.sin(radians)) * candidate.h) / 2;
        const extentY =
          (Math.abs(Math.sin(radians)) * candidate.w +
            Math.abs(Math.cos(radians)) * candidate.h) / 2;
        return (
          centerX - extentX >= -1e-8 &&
          centerX + extentX <= bounds.width + 1e-8 &&
          centerY - extentY >= -1e-8 &&
          centerY + extentY <= bounds.height + 1e-8
        );
      }

      function resizeWithinImage(start, anchorX, anchorY, width, height, nextFontSize, heightForWidth) {
        const candidate = (amount) => {
          const candidateWidth = start.w + (width - start.w) * amount;
          const candidateHeight = heightForWidth
            ? heightForWidth(candidateWidth)
            : start.h + (height - start.h) * amount;
          return rectFromAnchor(start, anchorX, anchorY, candidateWidth, candidateHeight);
        };
        let amount = 1;
        if (!fitsImage(candidate(1)) && fitsImage(candidate(0))) {
          let low = 0;
          let high = 1;
          for (let index = 0; index < 25; index += 1) {
            const middle = (low + high) / 2;
            if (fitsImage(candidate(middle))) {
              low = middle;
            } else {
              high = middle;
            }
          }
          amount = low;
        }
        rect = candidate(amount);
        fontSize = dragStart.fontSize + (nextFontSize - dragStart.fontSize) * amount;
        inputs.fontsize.value = Math.round(fontSize);
      }

      function resizeFromHandle(point) {
        const start = dragStart.rect;
        const delta = rotateVector(
          point.x - dragStart.point.x,
          point.y - dragStart.point.y,
          -dragStart.rotation,
        );
        const mode = dragMode;
        if (mode === "left" || mode === "right") {
          const width = Math.max(
            dragStart.fontSize,
            start.w + delta.x * (mode === "right" ? 1 : -1),
          );
          resizeWithinImage(
            start, mode === "left" ? 1 : 0, 0.5,
            width, start.h, dragStart.fontSize,
            (candidateWidth) => textSize(dragStart.fontSize, candidateWidth).h,
          );
          return;
        }
        const horizontal = delta.x * (mode.includes("e") ? 1 : -1) / start.w;
        const vertical = delta.y * (mode.startsWith("s") ? 1 : -1) / start.h;
        const ratio = Math.abs(horizontal) >= Math.abs(vertical) ? horizontal : vertical;
        const factor = Math.max(8 / dragStart.fontSize, 1 + ratio);
        resizeWithinImage(
          start,
          mode.includes("w") ? 1 : 0,
          mode.startsWith("n") ? 1 : 0,
          start.w * factor,
          start.h * factor,
          dragStart.fontSize * factor,
        );
      }

      function cursorForHandle(handle) {
        if (handle === "rotate") {
          return "grab";
        }
        const baseAngle = handle === "left" || handle === "right"
          ? 0
          : handle === "nw" || handle === "se" ? 45 : 135;
        const index = ((Math.round((baseAngle + rotation) / 45) % 4) + 4) % 4;
        return ["ew-resize", "nwse-resize", "ns-resize", "nesw-resize"][index];
      }

      canvas.addEventListener("pointerdown", (event) => {
        const point = canvasPoint(event);
        const handle = handleAt(point);
        if (handle) {
          dragMode = handle;
        } else if (inRect(point)) {
          dragMode = "move";
        } else {
          selected = false;
          draw();
          return;
        }
        selected = true;
        dragStart = { point, rect: { ...rect }, fontSize, rotation };
        canvas.setPointerCapture(event.pointerId);
        draw();
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!dragMode || !dragStart) {
          const point = canvasPoint(event);
          const handle = handleAt(point);
          canvas.style.cursor = handle
            ? cursorForHandle(handle)
            : inRect(point) ? "move" : "default";
          return;
        }
        const point = canvasPoint(event);
        const dx = point.x - dragStart.point.x;
        const dy = point.y - dragStart.point.y;
        if (dragMode === "move") {
          rect.x = Math.max(0, dragStart.rect.x + dx);
          rect.y = Math.max(0, dragStart.rect.y + dy);
          clampRect();
        } else if (dragMode === "rotate") {
          const center = {
            x: dragStart.rect.x + dragStart.rect.w / 2,
            y: dragStart.rect.y + dragStart.rect.h / 2,
          };
          const startAngle = Math.atan2(dragStart.point.y - center.y, dragStart.point.x - center.x);
          const currentAngle = Math.atan2(point.y - center.y, point.x - center.x);
          rotation = dragStart.rotation + ((currentAngle - startAngle) * 180) / Math.PI;
        } else {
          resizeFromHandle(point);
        }
        draw();
      });

      function endDrag(event) {
        dragMode = "";
        dragStart = null;
        if (canvas.hasPointerCapture(event.pointerId)) {
          canvas.releasePointerCapture(event.pointerId);
        }
      }

      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      saveBtn.addEventListener("click", async () => {
        if (!currentTemplateName()) {
          setStatus("Please enter a template name.", "error");
          return;
        }
        if (!imageFile && !currentImageDataUrl) {
          setStatus("Please choose a template image.", "error");
          return;
        }
        saveBtn.disabled = true;
        setStatus("保存中...");
        const payload = {};
        if (task) {
          payload.task = task;
        }
        payload.template_name = currentTemplateName();
        payload.image = imageFile
          ? await readFileAsDataUrl(imageFile)
          : currentImageDataUrl;
        payload.x = String(Math.round(rect.x));
        payload.y = String(Math.round(rect.y));
        payload.w = String(Math.round(rect.w));
        payload.h = String(Math.round(rect.h));
        payload.fontsize = String(Math.round(fontSize));
        payload.rotation = String(Math.round(rotation));
        payload.color = inputs.color.value || "#000000";
        payload.align = textAlign;
        payload.valign = textValign;
        if (currentFontValue()) {
          payload.font = currentFontValue();
        }

        try {
          const data = await pluginApiPost("editor/save", payload);
          if (data.status === "error") {
            throw new Error(data.message || "Failed to save template.");
          }
          setStatus(`Saved template: ${data.template}`, "ok");
        } catch (error) {
          setStatus(error.message || "Failed to save template.", "error");
        } finally {
          updateSaveState();
        }
      });

      initFontControls();
      initIconControls();
      setTemplateMode("new");
      fitTextHeight();
      draw();
      loadTemplates();
    </script>
  </body>
</html>
