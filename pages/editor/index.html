<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模版编辑</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --line: #d6dbe1;
        --text: #20262d;
        --muted: #68717d;
        --accent: #176b87;
        --soft: #e9f3f6;
        --danger: #a83232;
        --ok: #1f7a4d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .shell {
        height: 100vh;
        overflow: hidden;
      }

      .stage {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) 18px;
        min-width: 0;
        height: 100%;
        min-height: 0;
      }

      .editor-header {
        position: sticky;
        top: 0;
        z-index: 3;
        min-width: 0;
        background: var(--bg);
      }

      .topbar {
        display: flex;
        background: var(--panel);
        align-items: center;
        justify-content: space-between;
        flex-wrap: nowrap;
        gap: 12px 20px;
        height: 88px;
        padding: 8px 18px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        overflow-y: hidden;
      }

      .topbar-title {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
      }

      .history-controls {
        display: flex;
        gap: 4px;
      }

      .history-button {
        width: 34px;
        min-height: 34px;
        padding: 0;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        font-size: 20px;
        line-height: 1;
      }

      .history-button:hover:not(:disabled) {
        background: var(--soft);
        color: var(--accent);
      }

      .topbar h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .topbar-controls {
        display: flex;
        align-items: flex-end;
        flex-wrap: nowrap;
        gap: 10px 18px;
        min-width: 0;
        flex: none;
      }

      #saveBtn {
        flex: none;
      }

      .canvas-wrap {
        display: flex;
        align-items: safe center;
        justify-content: safe center;
        min-width: 0;
        min-height: 0;
        padding: clamp(24px, 5vw, 60px);
        overflow-x: hidden;
        overflow-y: auto;
        touch-action: none;
      }

      .horizontal-scroll {
        min-width: 0;
        height: 18px;
        overflow-x: scroll;
        overflow-y: hidden;
        background: var(--bg);
      }

      .horizontal-scroll-content {
        height: 1px;
      }

      .editor-surface {
        position: relative;
        flex: none;
        width: min(960px, calc(100vw - 48px));
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #ffffff;
        border: 1px solid var(--line);
        touch-action: none;
      }

      .selection-box {
        position: absolute;
        box-sizing: border-box;
        border: 2px dashed #176b87;
        background: rgba(23, 107, 135, 0.12);
        transform-origin: center;
        user-select: none;
      }

      .selection-handle {
        position: absolute;
        width: 10px;
        height: 10px;
        border: 2px solid #176b87;
        border-radius: 50%;
        background: #ffffff;
        transform: translate(-50%, -50%);
      }

      .selection-handle.nw { left: 0; top: 0; }
      .selection-handle.ne { left: 100%; top: 0; }
      .selection-handle.se { left: 100%; top: 100%; }
      .selection-handle.sw { left: 0; top: 100%; }

      .selection-handle.left,
      .selection-handle.right {
        width: 8px;
        height: 18px;
        border-radius: 0;
        top: 50%;
      }

      .selection-handle.left { left: 0; }
      .selection-handle.right { left: 100%; }

      .selection-handle.top,
      .selection-handle.bottom {
        display: none;
        left: 50%;
        width: 18px;
        height: 8px;
        border-radius: 0;
      }

      .selection-handle.top { top: 0; }
      .selection-handle.bottom { top: 100%; }

      .selection-box.vertical .selection-handle.left,
      .selection-box.vertical .selection-handle.right {
        display: none;
      }

      .selection-box.vertical .selection-handle.top,
      .selection-box.vertical .selection-handle.bottom {
        display: block;
      }

      .rotation-handle {
        display: none;
        position: absolute;
        left: 50%;
        top: calc(100% + 28px);
        color: #176b87;
        font-size: 22px;
        line-height: 22px;
        transform: translate(-50%, -50%);
      }

      .rotation-handle::before {
        position: absolute;
        left: 50%;
        bottom: 100%;
        height: 17px;
        border-left: 2px solid #176b87;
        content: "";
      }

      .selection-box.selected .rotation-handle { display: block; }

      .alignment-guide {
        display: none;
        position: absolute;
        background: #d94b42;
        pointer-events: none;
      }

      .rotation-angle {
        display: none;
        position: absolute;
        padding: 2px 5px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        font-size: 12px;
        line-height: 18px;
        white-space: nowrap;
        pointer-events: none;
        transform: translateY(-50%);
      }

      .selection-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        width: max-content;
        max-width: calc(100% - 36px);
        margin: 12px auto 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        height: 54px;
        overflow-x: auto;
        overflow-y: hidden;
        visibility: hidden;
        pointer-events: none;
      }

      .selection-toolbar.visible {
        visibility: visible;
        pointer-events: auto;
      }

      .selection-toolbar [hidden] {
        display: none;
      }

      .format-group {
        padding: 0 10px;
        border-right: 1px solid var(--line);
      }

      .format-group:first-child {
        padding-left: 0;
      }

      .format-group:last-child {
        padding-right: 0;
        border-right: 0;
      }

      .format-toggle-group {
        display: flex;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .format-toggle {
        width: 36px;
        min-height: 36px;
        padding: 0;
        border-radius: 0;
        background: var(--panel);
        color: var(--text);
        font-weight: 500;
      }

      .format-toggle + .format-toggle {
        border-left: 1px solid var(--line);
      }

      .format-toggle.active {
        background: var(--soft);
        color: var(--accent);
      }

      #boldBtn { font-weight: 700; }
      #italicBtn { font-style: italic; }
      #underlineBtn { text-decoration: underline; }
      #strikethroughBtn { text-decoration: line-through; }

      .group {
        display: flex;
        align-items: flex-end;
        flex-wrap: nowrap;
        gap: 8px;
        min-width: 0;
        flex: none;
      }

      .group-title {
        align-self: center;
        margin: 0 4px 0 0;
        font-size: 12px;
        font-weight: 650;
        color: var(--muted);
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select,
      button {
        min-height: 36px;
        border-radius: 6px;
        font: inherit;
      }

      input,
      select {
        width: 100%;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        padding: 6px 9px;
      }

      input[type="color"] {
        padding: 2px;
      }

      .grid2 {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .icon-control-grid {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .alignment-mode-button {
        flex: none;
        width: 36px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--accent);
        font-size: 20px;
        padding: 0;
      }

      .mode-switch {
        display: flex;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .mode-button {
        border: 0;
        border-radius: 0;
        background: #ffffff;
        color: var(--muted);
        padding: 0 10px;
      }

      .mode-button + .mode-button {
        border-left: 1px solid var(--line);
      }

      .mode-button.active {
        background: var(--soft);
        color: var(--accent);
      }

      .template-picker,
      .template-name-field,
      .font-field {
        width: 150px;
      }

      .selection-toolbar .font-field {
        width: 130px;
      }

      .image-field {
        width: 180px;
      }

      .font-size-field {
        width: 64px;
      }

      .color-field {
        width: 42px;
      }

      .selection-toolbar input[type="file"] {
        min-width: 0;
      }

      .preview-field {
        width: 160px;
      }

      .zoom-control {
        position: fixed;
        z-index: 2;
        right: 18px;
        bottom: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 2px 8px rgba(32, 38, 45, 0.12);
      }

      .zoom-control input {
        width: 130px;
        min-height: 0;
        padding: 0;
        accent-color: var(--accent);
      }

      .zoom-control output {
        min-width: 38px;
        color: var(--text);
        font-size: 12px;
        text-align: right;
      }

      .icon-control {
        width: 116px;
      }

      .icon-segment {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        min-height: 36px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
      }

      .icon-option {
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 34px;
        border: 0;
        border-right: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        padding: 0;
      }

      .icon-option:last-child {
        border-right: 0;
      }

      .icon-option.active {
        background: var(--soft);
        color: var(--accent);
      }

      .icon-option svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      button {
        border: 0;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font-weight: 650;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        white-space: nowrap;
      }

      .status:empty {
        display: none;
      }

      .status.error {
        color: var(--danger);
      }

      .status.ok {
        color: var(--ok);
      }

      @media (max-width: 900px) {
        .selection-toolbar {
          height: 70px;
        }
      }

      @media (max-width: 600px) {
        .topbar {
          padding: 8px 12px;
        }

        .selection-toolbar {
          max-width: calc(100% - 24px);
          margin: 10px auto 0;
          padding: 8px;
        }

        .zoom-control {
          right: 12px;
          bottom: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="stage">
        <div class="editor-header">
        <header class="topbar">
          <div class="topbar-title">
            <h1 id="templateName"></h1>
            <div class="history-controls" role="group" aria-label="编辑历史">
              <button id="undoBtn" class="history-button" type="button" title="撤销" aria-label="撤销" disabled>↶</button>
              <button id="redoBtn" class="history-button" type="button" title="重做" aria-label="重做" disabled>↷</button>
            </div>
            <div id="status" class="status"></div>
          </div>
          <div class="topbar-controls">
            <section class="group">
              <p class="group-title">模版</p>
              <div class="mode-switch" role="tablist" aria-label="模版操作">
                <button id="newTemplateBtn" class="mode-button active" type="button">新增模版</button>
                <button id="existingTemplateBtn" class="mode-button" type="button">选择已有</button>
              </div>
              <label id="templateSelectLabel" class="template-picker" hidden>
                已上传模版
                <select id="templateSelect">
                  <option value="">请选择模版</option>
                </select>
              </label>
              <label class="template-name-field">
                模版名称
                <input id="templateNameInput" type="text" maxlength="64" />
              </label>
            </section>
            <section class="group">
              <p class="group-title">图片</p>
              <label class="image-field">
                模版图片
                <input id="imageInput" type="file" accept="image/*" />
              </label>
            </section>
          </div>
          <button id="saveBtn" type="button" disabled>保存</button>
        </header>
        <div class="selection-toolbar" id="selectionToolbar" role="toolbar" aria-label="选中文本框工具栏" aria-hidden="true">
        <section class="group format-group" aria-label="文本内容">
          <input id="previewTextInput" class="preview-field" type="text" value="Name preview" title="文本预填" aria-label="文本预填" />
        </section>
        <section class="group format-group" aria-label="字体设置">
          <select id="fontInput" class="font-field" title="字体" aria-label="字体"></select>
          <div class="grid2">
            <input id="fontSizeInput" class="font-size-field" type="number" min="8" step="1" value="48" title="字号" aria-label="字号" />
            <input id="colorInput" class="color-field" type="color" value="#000000" title="颜色" aria-label="颜色" />
          </div>
        </section>
        <section class="group format-group" aria-label="字形设置">
          <div class="format-toggle-group" role="group" aria-label="文字样式">
            <button id="boldBtn" class="format-toggle" type="button" title="加粗" aria-label="加粗" aria-pressed="false">B</button>
            <button id="italicBtn" class="format-toggle" type="button" title="斜体" aria-label="斜体" aria-pressed="false">I</button>
            <button id="underlineBtn" class="format-toggle" type="button" title="下划线" aria-label="下划线" aria-pressed="false">U</button>
            <button id="strikethroughBtn" class="format-toggle" type="button" title="删除线" aria-label="删除线" aria-pressed="false">S</button>
          </div>
        </section>
        <section class="group format-group" aria-label="排版与对齐">
          <div class="icon-control-grid">
            <button class="alignment-mode-button" id="alignmentModeBtn" type="button" title="切换为竖版文字" aria-label="切换为竖版文字" aria-pressed="false">↕</button>
            <div class="icon-control">
              <span id="alignmentModeLabel" hidden>横版文字</span>
              <div class="icon-segment" id="alignControl">
                <button class="icon-option" type="button" data-value="left" title="左对齐" aria-label="左对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16" />
                    <path d="M4 10h10" />
                    <path d="M4 14h16" />
                    <path d="M4 18h10" />
                  </svg>
                </button>
                <button class="icon-option active" type="button" data-value="center" title="居中对齐" aria-label="居中对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16" />
                    <path d="M7 10h10" />
                    <path d="M4 14h16" />
                    <path d="M7 18h10" />
                  </svg>
                </button>
                <button class="icon-option" type="button" data-value="right" title="右对齐" aria-label="右对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16" />
                    <path d="M10 10h10" />
                    <path d="M4 14h16" />
                    <path d="M10 18h10" />
                  </svg>
                </button>
              </div>
              <div class="icon-segment" id="valignControl" hidden>
                <button class="icon-option" type="button" data-value="top" title="顶部对齐" aria-label="顶部对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 5h14" />
                    <path d="M8 9h8" />
                    <path d="M7 13h10" />
                    <path d="M9 17h6" />
                  </svg>
                </button>
                <button class="icon-option active" type="button" data-value="middle" title="垂直居中" aria-label="垂直居中">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 5h14" />
                    <path d="M8 9h8" />
                    <path d="M7 12h10" />
                    <path d="M8 15h8" />
                    <path d="M5 19h14" />
                  </svg>
                </button>
                <button class="icon-option" type="button" data-value="bottom" title="底部对齐" aria-label="底部对齐">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 7h6" />
                    <path d="M7 11h10" />
                    <path d="M8 15h8" />
                    <path d="M5 19h14" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>
        </div>
        </div>
        <div class="canvas-wrap">
          <div class="editor-surface" id="editorSurface">
            <canvas id="canvas" width="960" height="540"></canvas>
            <div class="alignment-guide" id="alignmentGuide"></div>
            <div class="selection-box" id="selectionBox">
              <span class="selection-handle nw"></span>
              <span class="selection-handle ne"></span>
              <span class="selection-handle se"></span>
              <span class="selection-handle sw"></span>
              <span class="selection-handle left"></span>
              <span class="selection-handle right"></span>
              <span class="selection-handle top"></span>
              <span class="selection-handle bottom"></span>
              <span class="rotation-handle" title="旋转" aria-hidden="true">↻</span>
            </div>
            <span class="rotation-angle" id="rotationAngle"></span>
          </div>
        </div>
        <div class="horizontal-scroll" id="horizontalScroll" aria-label="画布水平滚动">
          <div class="horizontal-scroll-content" id="horizontalScrollContent"></div>
        </div>
        <label class="zoom-control">
          缩放
          <input id="zoomInput" type="range" min="25" max="200" step="5" value="100" />
          <output id="zoomValue" for="zoomInput">100%</output>
        </label>
      </section>
    </main>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const parentHash = (() => {
        try {
          return window.parent?.location?.hash || "";
        } catch {
          return "";
        }
      })();
      const parentHashQuery = parentHash.includes("?")
        ? parentHash.slice(parentHash.indexOf("?") + 1)
        : "";
      const routeParams = new URLSearchParams(parentHashQuery);
      const task = urlParams.get("task") || routeParams.get("task") || "";
      const initialTemplateName =
        urlParams.get("name") || routeParams.get("name") || "";

      const canvas = document.getElementById("canvas");
      const canvasWrap = document.querySelector(".canvas-wrap");
      const horizontalScroll = document.getElementById("horizontalScroll");
      const horizontalScrollContent = document.getElementById("horizontalScrollContent");
      const selectionToolbar = document.getElementById("selectionToolbar");
      const editorSurface = document.getElementById("editorSurface");
      const selectionBox = document.getElementById("selectionBox");
      const alignmentGuide = document.getElementById("alignmentGuide");
      const rotationAngle = document.getElementById("rotationAngle");
      const ctx = canvas.getContext("2d");
      const imageInput = document.getElementById("imageInput");
      const saveBtn = document.getElementById("saveBtn");
      const undoBtn = document.getElementById("undoBtn");
      const redoBtn = document.getElementById("redoBtn");
      const statusEl = document.getElementById("status");
      const templateSelect = document.getElementById("templateSelect");
      const templateSelectLabel = document.getElementById("templateSelectLabel");
      const templateNameEl = document.getElementById("templateName");
      const templateNameInput = document.getElementById("templateNameInput");
      const previewTextInput = document.getElementById("previewTextInput");
      const zoomInput = document.getElementById("zoomInput");
      const zoomValue = document.getElementById("zoomValue");
      const newTemplateBtn = document.getElementById("newTemplateBtn");
      const existingTemplateBtn = document.getElementById("existingTemplateBtn");
      const alignControl = document.getElementById("alignControl");
      const valignControl = document.getElementById("valignControl");
      const alignmentModeBtn = document.getElementById("alignmentModeBtn");
      const alignmentModeLabel = document.getElementById("alignmentModeLabel");
      const styleButtons = {
        bold: document.getElementById("boldBtn"),
        italic: document.getElementById("italicBtn"),
        underline: document.getElementById("underlineBtn"),
        strikethrough: document.getElementById("strikethroughBtn"),
      };

      const fontOptions = [
        {
          value: "",
          label: "默认字体",
          css: "system-ui, sans-serif",
        },
        {
          value: "microsoft_yahei",
          label: "微软雅黑",
          css: '"Microsoft YaHei", "微软雅黑", sans-serif',
        },
        {
          value: "simhei",
          label: "黑体",
          css: "SimHei, 黑体, sans-serif",
        },
        {
          value: "simsun",
          label: "宋体",
          css: "SimSun, 宋体, serif",
        },
        {
          value: "pingfang",
          label: "苹方",
          css: '"PingFang SC", "Hiragino Sans GB", sans-serif',
        },
        {
          value: "noto_sans_cjk",
          label: "思源黑体",
          css: '"Noto Sans CJK SC", "Source Han Sans SC", sans-serif',
        },
        {
          value: "dejavu_sans",
          label: "DejaVu Sans",
          css: '"DejaVu Sans", sans-serif',
        },
      ];

      const inputs = {
        fontsize: document.getElementById("fontSizeInput"),
        color: document.getElementById("colorInput"),
        font: document.getElementById("fontInput"),
      };

      let imageFile = null;
      let bitmap = null;
      let scale = 1;
      let zoom = 1;
      let baseDisplayWidth = canvas.clientWidth;
      let rect = { x: 96, y: 220, w: 768, h: 96 };
      let fontSize = 48;
      let rotation = 0;
      let selected = false;
      let dragMode = "";
      let dragStart = null;
      let history = [];
      let historyIndex = -1;
      let textAlign = "center";
      let textValign = "middle";
      let orientation = "horizontal";
      const textStyles = { bold: false, italic: false, underline: false, strikethrough: false };
      let templateMode = "new";
      let currentImageDataUrl = "";
      let templateDetails = {};
      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.className = `status ${kind || ""}`.trim();
      }

      function currentTemplateName() {
        return templateNameInput.value.trim();
      }

      function updateTemplateTitle() {
        templateNameEl.textContent = currentTemplateName() || "未命名模版";
      }

      function currentFontOption() {
        return (
          fontOptions.find((option) => option.value === inputs.font.value) ||
          fontOptions[0]
        );
      }

      function currentFontValue() {
        return inputs.font.value;
      }

      function editorSnapshot() {
        return {
          rect: { ...rect },
          fontSize,
          rotation,
          textAlign,
          textValign,
          orientation,
          textStyles: { ...textStyles },
          font: inputs.font.value,
          color: inputs.color.value,
          previewText: previewTextInput.value,
        };
      }

      function updateHistoryButtons() {
        undoBtn.disabled = historyIndex <= 0;
        redoBtn.disabled = historyIndex < 0 || historyIndex >= history.length - 1;
      }

      function resetHistory() {
        history = [editorSnapshot()];
        historyIndex = 0;
        updateHistoryButtons();
      }

      function recordHistory() {
        const next = editorSnapshot();
        if (
          historyIndex >= 0 &&
          JSON.stringify(history[historyIndex]) === JSON.stringify(next)
        ) {
          return;
        }
        history = history.slice(0, historyIndex + 1);
        history.push(next);
        historyIndex = history.length - 1;
        updateHistoryButtons();
      }

      function restoreHistory(index) {
        if (index < 0 || index >= history.length || index === historyIndex) {
          return;
        }
        historyIndex = index;
        const snapshot = history[historyIndex];
        rect = { ...snapshot.rect };
        fontSize = snapshot.fontSize;
        rotation = snapshot.rotation;
        textAlign = snapshot.textAlign;
        textValign = snapshot.textValign;
        textStyles.bold = snapshot.textStyles.bold;
        textStyles.italic = snapshot.textStyles.italic;
        textStyles.underline = snapshot.textStyles.underline;
        textStyles.strikethrough = snapshot.textStyles.strikethrough;
        inputs.font.value = snapshot.font;
        inputs.color.value = snapshot.color;
        inputs.fontsize.value = Math.round(fontSize);
        previewTextInput.value = snapshot.previewText;
        setOrientation(snapshot.orientation);
        for (const style of Object.keys(styleButtons)) {
          styleButtons[style].classList.toggle("active", textStyles[style]);
          styleButtons[style].setAttribute("aria-pressed", String(textStyles[style]));
        }
        setIconControlValue(alignControl, textAlign);
        setIconControlValue(valignControl, textValign);
        updateHistoryButtons();
        draw();
      }

      function undo() {
        restoreHistory(historyIndex - 1);
      }

      function redo() {
        restoreHistory(historyIndex + 1);
      }

      function updateSaveState() {
        saveBtn.disabled =
          (!imageFile && !currentImageDataUrl) || !currentTemplateName();
      }

      function imageBounds() {
        return {
          width: bitmap?.width || Math.max(1, canvas.width / scale),
          height: bitmap?.height || Math.max(1, canvas.height / scale),
        };
      }

      function wrapText(text, maxWidth, measure) {
        const lines = [];
        for (const paragraph of text.split(/\r?\n/)) {
          let line = "";
          const tokens = paragraph.match(/[A-Za-z0-9]+(?:['-][A-Za-z0-9]+)*[ \t]*|[^\r\n]/gu) || [];
          for (let token of tokens) {
            if (measure(line + token) <= maxWidth) {
              line += token;
              continue;
            }
            if (line) {
              lines.push(line.trimEnd());
              line = "";
            }
            token = token.trimStart();
            if (measure(token.trimEnd()) <= maxWidth) {
              line = token;
              continue;
            }
            for (const character of Array.from(token.trimEnd())) {
              if (line && measure(line + character) > maxWidth) {
                lines.push(line.trimEnd());
                line = "";
              }
              line += character;
            }
          }
          lines.push(line.trimEnd());
        }
        return lines;
      }

      function textSize(size = fontSize, width = rect.w, height = rect.h) {
        ctx.save();
        ctx.font = `${textStyles.italic ? "italic " : ""}${textStyles.bold ? "bold " : ""}${size * scale}px ${currentFontOption().css}`;
        const previewText = previewTextInput.value;
        if (orientation === "vertical") {
          const cellSize = size * 1.2;
          const rows = Math.max(1, Math.floor(height / cellSize));
          const columns = previewText.split(/\r?\n/).flatMap((paragraph) => {
            const characters = Array.from(paragraph);
            const parts = [];
            for (let index = 0; index < Math.max(1, characters.length); index += rows) {
              parts.push(characters.slice(index, index + rows));
            }
            return parts;
          });
          ctx.restore();
          return { w: columns.length * cellSize, h: height, cellSize, columns };
        }
        const metrics = ctx.measureText(previewText);
        const lines = wrapText(
          previewText,
          width * scale,
          (value) => ctx.measureText(value).width,
        );
        ctx.restore();
        const ascent = (metrics.actualBoundingBoxAscent || size * scale * 0.8) / scale;
        const descent = (metrics.actualBoundingBoxDescent || size * scale * 0.2) / scale;
        const lineHeight = size * 1.2;
        return {
          w: metrics.width / scale,
          h: ascent + descent + (lines.length - 1) * lineHeight + size / 6
            + (textStyles.underline ? size / 10 : 0),
          ascent,
          descent,
          lineHeight,
          lines,
        };
      }

      function fitTextHeight(keepCenter = true) {
        if (orientation === "vertical") {
          const limits = boxLimits(rect);
          const radians = (rotation * Math.PI) / 180;
          const cosine = Math.abs(Math.cos(radians));
          const sine = Math.abs(Math.sin(radians));
          const maxWidth = Math.min(
            cosine ? (limits.right - limits.left - sine * rect.h) / cosine : Infinity,
            sine ? (limits.bottom - limits.top - cosine * rect.h) / sine : Infinity,
          );
          const width = Math.max(1, Math.min(textSize().w, maxWidth));
          if (keepCenter) {
            rect.x += (rect.w - width) / 2;
          }
          rect.w = width;
          const nextLimits = boxLimits(rect);
          if (nextLimits.extentX * 2 <= nextLimits.right - nextLimits.left &&
              nextLimits.extentY * 2 <= nextLimits.bottom - nextLimits.top) {
            rect.x = Math.min(Math.max(rect.x, nextLimits.left + nextLimits.extentX - rect.w / 2),
              nextLimits.right - nextLimits.extentX - rect.w / 2);
            rect.y = Math.min(Math.max(rect.y, nextLimits.top + nextLimits.extentY - rect.h / 2),
              nextLimits.bottom - nextLimits.extentY - rect.h / 2);
          }
          return;
        }
        const height = Math.max(1, textSize().h);
        if (keepCenter) {
          rect.y += (rect.h - height) / 2;
        }
        rect.h = height;
      }

      function rotateVector(x, y, angle = rotation) {
        const radians = (angle * Math.PI) / 180;
        return {
          x: x * Math.cos(radians) - y * Math.sin(radians),
          y: x * Math.sin(radians) + y * Math.cos(radians),
        };
      }

      function boxLimits(candidate, angle = rotation) {
        const wrap = canvasWrap.getBoundingClientRect();
        const image = canvas.getBoundingClientRect();
        const bounds = imageBounds();
        const unitX = canvas.clientWidth / bounds.width;
        const unitY = canvas.clientHeight / bounds.height;
        const padding = Math.min(60, Math.max(24, window.innerWidth * 0.05));
        const radians = (angle * Math.PI) / 180;
        const extentX = (Math.abs(Math.cos(radians)) * candidate.w +
          Math.abs(Math.sin(radians)) * candidate.h) / 2;
        const extentY = (Math.abs(Math.sin(radians)) * candidate.w +
          Math.abs(Math.cos(radians)) * candidate.h) / 2;
        const centerX = candidate.x + candidate.w / 2;
        const centerY = candidate.y + candidate.h / 2;
        const left = (Math.min(wrap.left, image.left - padding) - image.left - canvas.clientLeft) / unitX;
        const right = (Math.max(wrap.right, image.right + padding) - image.left - canvas.clientLeft) / unitX;
        const top = (Math.min(wrap.top, image.top - padding) - image.top - canvas.clientTop) / unitY;
        const bottom = (Math.max(wrap.bottom, image.bottom + padding) - image.top - canvas.clientTop) / unitY;
        return {
          left, right, top, bottom, extentX, extentY,
          fits: centerX - extentX >= left - 1e-8 &&
            centerX + extentX <= right + 1e-8 &&
            centerY - extentY >= top - 1e-8 &&
            centerY + extentY <= bottom + 1e-8,
        };
      }

      function localPoint(point) {
        const center = { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 };
        const offset = rotateVector(point.x - center.x, point.y - center.y, -rotation);
        return { x: center.x + offset.x, y: center.y + offset.y };
      }

      function handleAt(point) {
        const local = localPoint(point);
        const displayScale = canvas.clientWidth / imageBounds().width;
        const radius = 9 / displayScale;
        const handles = {
          nw: [rect.x, rect.y],
          ne: [rect.x + rect.w, rect.y],
          se: [rect.x + rect.w, rect.y + rect.h],
          sw: [rect.x, rect.y + rect.h],
        };
        if (orientation === "vertical") {
          handles.top = [rect.x + rect.w / 2, rect.y];
          handles.bottom = [rect.x + rect.w / 2, rect.y + rect.h];
        } else {
          handles.left = [rect.x, rect.y + rect.h / 2];
          handles.right = [rect.x + rect.w, rect.y + rect.h / 2];
        }
        if (selected &&
            Math.hypot(local.x - rect.x - rect.w / 2, local.y - rect.y - rect.h - 28 / displayScale) <= radius) {
          return "rotate";
        }
        for (const [name, [x, y]] of Object.entries(handles)) {
          if (Math.hypot(local.x - x, local.y - y) <= radius) {
            return name;
          }
        }
        return "";
      }

      function fitCanvas(width, height) {
        const padding = Math.min(60, Math.max(24, window.innerWidth * 0.05));
        const maxWidth = Math.max(1, canvasWrap.clientWidth - padding * 2);
        const maxHeight = Math.max(1, canvasWrap.clientHeight - padding * 2);
        scale = Math.min(maxWidth / width, maxHeight / height, 1);
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        baseDisplayWidth = canvas.width;
        editorSurface.style.width = `${baseDisplayWidth * zoom}px`;
      }

      function drawTextPreview() {
        const layout = textSize();
        const previewFontSize = fontSize * scale;
        const x = rect.x * scale;
        const y = rect.y * scale;
        const w = rect.w * scale;
        const h = rect.h * scale;
        const fontOption = currentFontOption();
        ctx.save();
        ctx.font = `${textStyles.italic ? "italic " : ""}${textStyles.bold ? "bold " : ""}${previewFontSize}px ${fontOption.css}`;
        ctx.fillStyle = inputs.color.value || "#000000";
        ctx.strokeStyle = ctx.fillStyle;
        ctx.lineWidth = Math.max(1, previewFontSize / 20);
        ctx.textBaseline = "alphabetic";
        if (orientation === "vertical") {
          const cell = layout.cellSize * scale;
          ctx.textAlign = "center";
          layout.columns.forEach((column, columnIndex) => {
            const spare = Math.max(0, h - column.length * cell);
            const offset = textValign === "bottom" ? spare
              : textValign === "middle" ? spare / 2 : 0;
            const columnX = x + (w + layout.columns.length * cell) / 2
              - cell / 2 - columnIndex * cell;
            column.forEach((character, row) => {
              const metrics = ctx.measureText(character);
              const ascent = metrics.actualBoundingBoxAscent || previewFontSize * 0.8;
              const descent = metrics.actualBoundingBoxDescent || previewFontSize * 0.2;
              const baseline = y + offset + row * cell + (cell - ascent - descent) / 2 + ascent;
              ctx.fillText(character, columnX, baseline);
              if (textStyles.underline || textStyles.strikethrough) {
                const startX = columnX - metrics.width / 2;
                const endX = columnX + metrics.width / 2;
                ctx.beginPath();
                if (textStyles.underline) {
                  const lineY = baseline + descent + previewFontSize / 16;
                  ctx.moveTo(startX, lineY);
                  ctx.lineTo(endX, lineY);
                }
                if (textStyles.strikethrough) {
                  const lineY = baseline - ascent / 2;
                  ctx.moveTo(startX, lineY);
                  ctx.lineTo(endX, lineY);
                }
                ctx.stroke();
              }
            });
          });
          ctx.restore();
          return;
        }
        ctx.textAlign = textAlign;
        const textX =
          textAlign === "center"
            ? x + w / 2
            : textAlign === "right"
              ? x + w
              : x;
        const padding = previewFontSize / 12;
        const contentHeight =
          (layout.ascent + layout.descent +
            (layout.lines.length - 1) * layout.lineHeight) * scale;
        const extra = Math.max(0, h - contentHeight - padding * 2);
        const offset =
          textValign === "bottom" ? extra : textValign === "middle" ? extra / 2 : 0;
        const firstY = y + padding + offset + layout.ascent * scale;
        layout.lines.forEach((line, index) => {
          const baseline = firstY + index * layout.lineHeight * scale;
          ctx.fillText(line, textX, baseline);
          if (textStyles.underline || textStyles.strikethrough) {
            const lineWidth = ctx.measureText(line).width;
            const startX = textAlign === "center" ? textX - lineWidth / 2
              : textAlign === "right" ? textX - lineWidth : textX;
            ctx.beginPath();
            if (textStyles.underline) {
              const lineY = baseline + layout.descent * scale + previewFontSize / 16;
              ctx.moveTo(startX, lineY);
              ctx.lineTo(startX + lineWidth, lineY);
            }
            if (textStyles.strikethrough) {
              const lineY = baseline - layout.ascent * scale / 2;
              ctx.moveTo(startX, lineY);
              ctx.lineTo(startX + lineWidth, lineY);
            }
            ctx.stroke();
          }
        });
        ctx.restore();
      }

      function draw() {
        selectionToolbar.classList.toggle("visible", selected);
        selectionToolbar.setAttribute("aria-hidden", String(!selected));
        selectionToolbar.inert = !selected;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (bitmap) {
          ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        const x = rect.x * scale;
        const y = rect.y * scale;
        const w = rect.w * scale;
        const h = rect.h * scale;
        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.translate(-x - w / 2, -y - h / 2);
        drawTextPreview();
        ctx.restore();

        const bounds = imageBounds();
        selectionBox.style.left = `${(rect.x / bounds.width) * 100}%`;
        selectionBox.style.top = `${(rect.y / bounds.height) * 100}%`;
        selectionBox.style.width = `${(rect.w / bounds.width) * 100}%`;
        selectionBox.style.height = `${(rect.h / bounds.height) * 100}%`;
        selectionBox.style.transform = `rotate(${rotation}deg)`;
        selectionBox.classList.toggle("selected", selected);
        selectionBox.classList.toggle("vertical", orientation === "vertical");

        const axis = ((rotation % 180) + 180) % 180;
        const horizontal = Math.min(axis, 180 - axis) <= 2;
        const vertical = Math.abs(axis - 90) <= 2;
        alignmentGuide.style.display = dragMode === "rotate" && (horizontal || vertical)
          ? "block" : "none";
        if (horizontal) {
          alignmentGuide.style.left = "0";
          alignmentGuide.style.top = `${((rect.y + rect.h / 2) / bounds.height) * 100}%`;
          alignmentGuide.style.width = "100%";
          alignmentGuide.style.height = "1px";
        } else if (vertical) {
          alignmentGuide.style.left = `${((rect.x + rect.w / 2) / bounds.width) * 100}%`;
          alignmentGuide.style.top = "0";
          alignmentGuide.style.width = "1px";
          alignmentGuide.style.height = "100%";
        }

        rotationAngle.style.display = dragMode === "rotate" ? "block" : "none";
        if (dragMode === "rotate") {
          const angle = ((Math.round(rotation) + 180) % 360 + 360) % 360 - 180;
          const handle = rotateVector(
            0,
            rect.h * canvas.clientHeight / bounds.height / 2 + 28,
          );
          rotationAngle.textContent = `${angle}°`;
          rotationAngle.style.left = `calc(${((rect.x + rect.w / 2) / bounds.width) * 100}% + ${handle.x + 16}px)`;
          rotationAngle.style.top = `calc(${((rect.y + rect.h / 2) / bounds.height) * 100}% + ${handle.y}px)`;
        }
        horizontalScroll.style.width = `${canvasWrap.clientWidth}px`;
        horizontalScrollContent.style.width = `${canvasWrap.scrollWidth}px`;
      }

      function canvasPoint(event) {
        const box = canvas.getBoundingClientRect();
        return {
          x:
            ((event.clientX - box.left - canvas.clientLeft) * canvas.width) /
            canvas.clientWidth /
            scale,
          y:
            ((event.clientY - box.top - canvas.clientTop) * canvas.height) /
            canvas.clientHeight /
            scale,
        };
      }

      function inRect(point) {
        point = localPoint(point);
        return (
          point.x >= rect.x &&
          point.x <= rect.x + rect.w &&
          point.y >= rect.y &&
          point.y <= rect.y + rect.h
        );
      }

      function selectFont(value) {
        inputs.font.value = value;
        draw();
      }

      async function loadTemplateDetail(name) {
        const detail = templateDetails[name];
        if (!detail) {
          return;
        }
        imageFile = null;
        imageInput.value = "";
        currentImageDataUrl = detail.background || "";
        if (currentImageDataUrl) {
          const response = await fetch(currentImageDataUrl);
          const blob = await response.blob();
          bitmap = await createImageBitmap(blob);
          fitCanvas(bitmap.width, bitmap.height);
        }
        const layer = detail.layer || {};
        rect = {
          x: Number(layer.x) || 0,
          y: Number(layer.y) || 0,
          w: Number(layer.w) || Math.max(1, detail.width || canvas.width),
          h: Number(layer.h) || Math.max(1, detail.height || canvas.height),
        };
        fontSize = Math.max(8, Number(layer.fontsize) || 48);
        rotation = Number(layer.rotation) || 0;
        inputs.fontsize.value = Math.round(fontSize);
        inputs.color.value = layer.color || "#000000";
        selectFont(layer.font || "");
        previewTextInput.value = layer.default || "Name preview";
        for (const style of Object.keys(styleButtons)) {
          textStyles[style] = layer[style] === true;
          styleButtons[style].classList.toggle("active", textStyles[style]);
          styleButtons[style].setAttribute("aria-pressed", String(textStyles[style]));
        }
        textAlign = layer.align || "center";
        textValign = layer.valign || "middle";
        setOrientation(layer.orientation || "horizontal");
        setIconControlValue(alignControl, textAlign);
        setIconControlValue(valignControl, textValign);
        fitTextHeight();
        draw();
        resetHistory();
        updateSaveState();
      }

      function initFontControls() {
        inputs.font.innerHTML = "";
        fontOptions.forEach((option) => {
          const selectOption = document.createElement("option");
          selectOption.value = option.value;
          selectOption.textContent = option.label;
          inputs.font.appendChild(selectOption);
        });
        selectFont("");
      }

      function setTemplateMode(mode) {
        templateMode = mode;
        const isExisting = templateMode === "existing";
        newTemplateBtn.classList.toggle("active", !isExisting);
        existingTemplateBtn.classList.toggle("active", isExisting);
        templateSelectLabel.hidden = !isExisting;
        templateNameInput.readOnly = isExisting;
        if (isExisting) {
          templateNameInput.value = templateSelect.value || "";
        } else if (
          templateSelect.value &&
          templateNameInput.value === templateSelect.value
        ) {
          templateSelect.value = "";
          templateNameInput.value = initialTemplateName || "";
          if (!imageFile) {
            currentImageDataUrl = "";
          }
        }
        updateTemplateTitle();
        updateSaveState();
      }

      function setIconControlValue(control, value) {
        [...control.querySelectorAll(".icon-option")].forEach((button) => {
          button.classList.toggle("active", button.dataset.value === value);
        });
      }

      function setOrientation(value) {
        orientation = value === "vertical" ? "vertical" : "horizontal";
        const vertical = orientation === "vertical";
        alignControl.hidden = vertical;
        valignControl.hidden = !vertical;
        alignmentModeLabel.textContent = vertical ? "竖版文字" : "横版文字";
        alignmentModeBtn.textContent = vertical ? "↔" : "↕";
        alignmentModeBtn.title = vertical ? "切换为横版文字" : "切换为竖版文字";
        alignmentModeBtn.setAttribute("aria-label", alignmentModeBtn.title);
        alignmentModeBtn.setAttribute("aria-pressed", String(vertical));
      }

      function initIconControls() {
        for (const [style, button] of Object.entries(styleButtons)) {
          button.addEventListener("click", () => {
            textStyles[style] = !textStyles[style];
            button.classList.toggle("active", textStyles[style]);
            button.setAttribute("aria-pressed", String(textStyles[style]));
            if (style === "bold" || style === "italic" || style === "underline") {
              fitTextHeight();
            }
            draw();
            recordHistory();
          });
        }
        alignmentModeBtn.addEventListener("click", () => {
          const centerX = rect.x + rect.w / 2;
          const centerY = rect.y + rect.h / 2;
          const limits = boxLimits(rect);
          const swapped = { w: rect.h, h: rect.w };
          const radians = (rotation * Math.PI) / 180;
          const extentX = Math.abs(Math.cos(radians)) * swapped.w
            + Math.abs(Math.sin(radians)) * swapped.h;
          const extentY = Math.abs(Math.sin(radians)) * swapped.w
            + Math.abs(Math.cos(radians)) * swapped.h;
          const factor = Math.min(1, (limits.right - limits.left) / extentX,
            (limits.bottom - limits.top) / extentY);
          rect.w = swapped.w * factor;
          rect.h = swapped.h * factor;
          rect.x = centerX - rect.w / 2;
          rect.y = centerY - rect.h / 2;
          setOrientation(orientation === "horizontal" ? "vertical" : "horizontal");
          fitTextHeight();
          const nextLimits = boxLimits(rect);
          rect.x = Math.min(Math.max(rect.x, nextLimits.left + nextLimits.extentX - rect.w / 2),
            nextLimits.right - nextLimits.extentX - rect.w / 2);
          rect.y = Math.min(Math.max(rect.y, nextLimits.top + nextLimits.extentY - rect.h / 2),
            nextLimits.bottom - nextLimits.extentY - rect.h / 2);
          draw();
          recordHistory();
        });
        alignControl.addEventListener("click", (event) => {
          const button = event.target.closest(".icon-option");
          if (!button) {
            return;
          }
          textAlign = button.dataset.value || "center";
          setIconControlValue(alignControl, textAlign);
          draw();
          recordHistory();
        });
        valignControl.addEventListener("click", (event) => {
          const button = event.target.closest(".icon-option");
          if (!button) {
            return;
          }
          textValign = button.dataset.value || "middle";
          setIconControlValue(valignControl, textValign);
          draw();
          recordHistory();
        });
        setIconControlValue(alignControl, textAlign);
        setIconControlValue(valignControl, textValign);
        setOrientation(orientation);
      }

      async function getPluginBridge() {
        if (window.AstrBotPluginPage) {
          await window.AstrBotPluginPage.ready();
          return window.AstrBotPluginPage;
        }
        if (window.parent === window) {
          return null;
        }
        for (let index = 0; index < 20; index += 1) {
          await new Promise((resolve) => setTimeout(resolve, 100));
          if (window.AstrBotPluginPage) {
            await window.AstrBotPluginPage.ready();
            return window.AstrBotPluginPage;
          }
        }
        return null;
      }

      async function pluginApiGet(endpoint, params) {
        const bridge = await getPluginBridge();
        if (bridge) {
          return bridge.apiGet(endpoint, params);
        }
        const query = new URLSearchParams();
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value !== null && value !== undefined && value !== "") {
            query.set(key, String(value));
          }
        });
        const suffix = query.toString() ? `?${query.toString()}` : "";
        const response = await fetch(
          `/api/plug/astrbot_plugin_customized_invitation/${endpoint}${suffix}`,
        );
        const data = await response.json();
        if (!response.ok || data.status === "error") {
          throw new Error(data.message || "Request failed.");
        }
        return data;
      }

      async function pluginApiPost(endpoint, body) {
        const bridge = await getPluginBridge();
        if (bridge) {
          return bridge.apiPost(endpoint, body);
        }
        const response = await fetch(
          `/api/plug/astrbot_plugin_customized_invitation/${endpoint}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          },
        );
        const data = await response.json();
        if (!response.ok || data.status === "error") {
          throw new Error(data.message || "Request failed.");
        }
        return data;
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("Failed to read image."));
          reader.readAsDataURL(file);
        });
      }

      async function loadTemplates() {
        templateNameInput.value = initialTemplateName;
        updateTemplateTitle();
        updateSaveState();

        try {
          const data = await pluginApiGet("editor/templates", { task });
          if (data.status === "error") {
            throw new Error(data.message || "Failed to load templates.");
          }
          templateDetails = data.templates || {};

          const names = [
            ...(data.user_templates || []),
            ...(data.global_templates || []),
          ];
          [...new Set(names)].forEach((name) => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            templateSelect.appendChild(option);
          });

          const currentName = data.current || initialTemplateName;
          if (currentName) {
            templateNameInput.value = currentName;
            templateSelect.value = currentName;
            if (templateSelect.value) {
              setTemplateMode("existing");
              await loadTemplateDetail(currentName);
            }
          }
          updateTemplateTitle();
          updateSaveState();
        } catch (error) {
          setStatus(error.message || "Failed to load templates.", "error");
        }
      }

      templateSelect.addEventListener("change", async () => {
        if (templateMode === "existing") {
          templateNameInput.value = templateSelect.value || "";
          if (templateSelect.value) {
            await loadTemplateDetail(templateSelect.value);
          }
        }
        updateTemplateTitle();
        updateSaveState();
      });

      templateNameInput.addEventListener("input", () => {
        if (templateMode === "new") {
          templateSelect.value = "";
        }
        updateTemplateTitle();
        updateSaveState();
      });

      newTemplateBtn.addEventListener("click", () => setTemplateMode("new"));
      existingTemplateBtn.addEventListener("click", () =>
        setTemplateMode("existing"),
      );
      undoBtn.addEventListener("click", undo);
      redoBtn.addEventListener("click", redo);

      imageInput.addEventListener("change", async () => {
        imageFile = imageInput.files?.[0] || null;
        if (!imageFile) {
          updateSaveState();
          return;
        }
        currentImageDataUrl = "";
        bitmap = await createImageBitmap(imageFile);
        fitCanvas(bitmap.width, bitmap.height);
        fontSize = Math.max(32, Math.round(bitmap.height / 12));
        const initialSize = textSize(fontSize, bitmap.width);
        const boxWidth = Math.min(bitmap.width, Math.ceil(initialSize.w + fontSize / 3));
        rect = {
          x: Math.round((bitmap.width - boxWidth) / 2),
          y: Math.round(bitmap.height * 0.45),
          w: boxWidth,
          h: textSize(fontSize, boxWidth).h,
        };
        rotation = 0;
        inputs.fontsize.value = fontSize;
        draw();
        resetHistory();
        updateSaveState();
        setStatus("");
      });

      inputs.fontsize.addEventListener("input", () => {
        fontSize = Math.max(8, Number(inputs.fontsize.value) || 48);
        fitTextHeight();
        draw();
        recordHistory();
      });
      inputs.color.addEventListener("input", () => {
        draw();
        recordHistory();
      });
      inputs.font.addEventListener("change", () => {
        fitTextHeight();
        draw();
        recordHistory();
      });
      previewTextInput.addEventListener("input", () => {
        fitTextHeight();
        draw();
        recordHistory();
      });
      zoomInput.addEventListener("input", () => {
        zoom = Number(zoomInput.value) / 100;
        zoomValue.textContent = `${zoomInput.value}%`;
        editorSurface.style.width = `${baseDisplayWidth * zoom}px`;
        horizontalScroll.style.width = `${canvasWrap.clientWidth}px`;
        horizontalScrollContent.style.width = `${canvasWrap.scrollWidth}px`;
      });
      canvasWrap.addEventListener("scroll", () => {
        horizontalScroll.scrollLeft = canvasWrap.scrollLeft;
      });
      horizontalScroll.addEventListener("scroll", () => {
        canvasWrap.scrollLeft = horizontalScroll.scrollLeft;
      });

      function rectFromAnchor(start, anchorX, anchorY, width, height) {
        const center = {
          x: start.x + start.w / 2,
          y: start.y + start.h / 2,
        };
        const fixed = rotateVector(
          (anchorX - 0.5) * start.w,
          (anchorY - 0.5) * start.h,
          dragStart.rotation,
        );
        const anchorGlobal = { x: center.x + fixed.x, y: center.y + fixed.y };
        const newOffset = rotateVector(
          (anchorX - 0.5) * width,
          (anchorY - 0.5) * height,
          dragStart.rotation,
        );
        return {
          x: anchorGlobal.x - newOffset.x - width / 2,
          y: anchorGlobal.y - newOffset.y - height / 2,
          w: width,
          h: height,
        };
      }

      function resizeFromAnchor(start, anchorX, anchorY, width, height, nextFontSize, heightForWidth, widthForHeight) {
        const candidate = (amount) => {
          const scaledHeight = start.h + (height - start.h) * amount;
          const candidateWidth = widthForHeight
            ? widthForHeight(scaledHeight)
            : start.w + (width - start.w) * amount;
          const candidateHeight = heightForWidth
            ? heightForWidth(candidateWidth)
            : scaledHeight;
          return rectFromAnchor(start, anchorX, anchorY, candidateWidth, candidateHeight);
        };
        let amount = 1;
        if (!boxLimits(candidate(1)).fits) {
          if (boxLimits(candidate(0)).fits) {
            let low = 0;
            let high = 1;
            for (let index = 0; index < 25; index += 1) {
              const middle = (low + high) / 2;
              if (boxLimits(candidate(middle)).fits) {
                low = middle;
              } else {
                high = middle;
              }
            }
            amount = low;
          } else {
            amount = 0;
          }
        }
        rect = candidate(amount);
        fontSize = dragStart.fontSize + (nextFontSize - dragStart.fontSize) * amount;
        inputs.fontsize.value = Math.round(fontSize);
      }

      function resizeFromHandle(point) {
        const start = dragStart.rect;
        const delta = rotateVector(
          point.x - dragStart.point.x,
          point.y - dragStart.point.y,
          -dragStart.rotation,
        );
        const mode = dragMode;
        if (mode === "left" || mode === "right") {
          const width = Math.max(
            dragStart.fontSize,
            start.w + delta.x * (mode === "right" ? 1 : -1),
          );
          resizeFromAnchor(
            start, mode === "left" ? 1 : 0, 0.5,
            width, start.h, dragStart.fontSize,
            (candidateWidth) => orientation === "vertical"
              ? start.h : textSize(dragStart.fontSize, candidateWidth).h,
          );
          return;
        }
        if (mode === "top" || mode === "bottom") {
          const height = Math.max(
            dragStart.fontSize * 1.2,
            start.h + delta.y * (mode === "bottom" ? 1 : -1),
          );
          resizeFromAnchor(
            start, 0.5, mode === "top" ? 1 : 0,
            start.w, height, dragStart.fontSize,
            null,
            (candidateHeight) => Math.max(1,
              textSize(dragStart.fontSize, start.w, candidateHeight).w),
          );
          return;
        }
        const horizontal = delta.x * (mode.includes("e") ? 1 : -1) / start.w;
        const vertical = delta.y * (mode.startsWith("s") ? 1 : -1) / start.h;
        const ratio = Math.abs(horizontal) >= Math.abs(vertical) ? horizontal : vertical;
        const factor = Math.max(8 / dragStart.fontSize, 1 + ratio);
        resizeFromAnchor(
          start,
          mode.includes("w") ? 1 : 0,
          mode.startsWith("n") ? 1 : 0,
          start.w * factor,
          start.h * factor,
          dragStart.fontSize * factor,
        );
      }

      function cursorForHandle(handle) {
        if (handle === "rotate") {
          return "grab";
        }
        const baseAngle = handle === "left" || handle === "right"
          ? 0
          : handle === "top" || handle === "bottom" ? 90
          : handle === "nw" || handle === "se" ? 45 : 135;
        const index = ((Math.round((baseAngle + rotation) / 45) % 4) + 4) % 4;
        return ["ew-resize", "nwse-resize", "ns-resize", "nesw-resize"][index];
      }

      canvasWrap.addEventListener("pointerdown", (event) => {
        const point = canvasPoint(event);
        const handle = handleAt(point);
        if (handle) {
          dragMode = handle;
        } else if (inRect(point)) {
          dragMode = "move";
        } else {
          selected = false;
          draw();
          return;
        }
        selected = true;
        dragStart = { point, rect: { ...rect }, fontSize, rotation };
        canvasWrap.setPointerCapture(event.pointerId);
        draw();
      });

      canvasWrap.addEventListener("pointermove", (event) => {
        if (!dragMode || !dragStart) {
          const point = canvasPoint(event);
          const handle = handleAt(point);
          canvasWrap.style.cursor = handle
            ? cursorForHandle(handle)
            : inRect(point) ? "move" : "default";
          return;
        }
        const point = canvasPoint(event);
        const dx = point.x - dragStart.point.x;
        const dy = point.y - dragStart.point.y;
        if (dragMode === "move") {
          const limits = boxLimits(dragStart.rect);
          const minX = limits.left + limits.extentX - rect.w / 2;
          const maxX = limits.right - limits.extentX - rect.w / 2;
          const minY = limits.top + limits.extentY - rect.h / 2;
          const maxY = limits.bottom - limits.extentY - rect.h / 2;
          if (minX <= maxX) {
            rect.x = Math.min(Math.max(dragStart.rect.x + dx, minX), maxX);
          }
          if (minY <= maxY) {
            rect.y = Math.min(Math.max(dragStart.rect.y + dy, minY), maxY);
          }
        } else if (dragMode === "rotate") {
          const center = {
            x: dragStart.rect.x + dragStart.rect.w / 2,
            y: dragStart.rect.y + dragStart.rect.h / 2,
          };
          const startAngle = Math.atan2(dragStart.point.y - center.y, dragStart.point.x - center.x);
          const currentAngle = Math.atan2(point.y - center.y, point.x - center.x);
          const nextRotation = dragStart.rotation + ((currentAngle - startAngle) * 180) / Math.PI;
          const limits = boxLimits(rect, nextRotation);
          if (limits.extentX * 2 <= limits.right - limits.left &&
              limits.extentY * 2 <= limits.bottom - limits.top) {
            rotation = nextRotation;
            rect.x = Math.min(Math.max(rect.x, limits.left + limits.extentX - rect.w / 2),
              limits.right - limits.extentX - rect.w / 2);
            rect.y = Math.min(Math.max(rect.y, limits.top + limits.extentY - rect.h / 2),
              limits.bottom - limits.extentY - rect.h / 2);
          }
        } else {
          resizeFromHandle(point);
        }
        draw();
      });

      function endDrag(event) {
        if (dragStart) {
          recordHistory();
        }
        dragMode = "";
        dragStart = null;
        draw();
        if (canvasWrap.hasPointerCapture(event.pointerId)) {
          canvasWrap.releasePointerCapture(event.pointerId);
        }
      }

      canvasWrap.addEventListener("pointerup", endDrag);
      canvasWrap.addEventListener("pointercancel", endDrag);

      window.addEventListener("keydown", (event) => {
        if (!selected || dragMode || event.altKey || event.ctrlKey || event.metaKey ||
            event.target?.closest("input, textarea, select, button, [contenteditable]")) {
          return;
        }
        const key = event.key.toLowerCase();
        let dx = 0;
        let dy = 0;
        if (key === "arrowleft" || key === "a") dx = -1;
        else if (key === "arrowright" || key === "d") dx = 1;
        else if (key === "arrowup" || key === "w") dy = -1;
        else if (key === "arrowdown" || key === "s") dy = 1;
        else return;

        event.preventDefault();
        const limits = boxLimits(rect);
        const minX = limits.left + limits.extentX - rect.w / 2;
        const maxX = limits.right - limits.extentX - rect.w / 2;
        const minY = limits.top + limits.extentY - rect.h / 2;
        const maxY = limits.bottom - limits.extentY - rect.h / 2;
        if (dx && minX <= maxX) {
          rect.x = Math.min(Math.max(rect.x + dx, minX), maxX);
        }
        if (dy && minY <= maxY) {
          rect.y = Math.min(Math.max(rect.y + dy, minY), maxY);
        }
        draw();
        recordHistory();
      });

      saveBtn.addEventListener("click", async () => {
        if (!currentTemplateName()) {
          setStatus("Please enter a template name.", "error");
          return;
        }
        if (!imageFile && !currentImageDataUrl) {
          setStatus("Please choose a template image.", "error");
          return;
        }
        saveBtn.disabled = true;
        setStatus("保存中...");
        const payload = {};
        if (task) {
          payload.task = task;
        }
        payload.template_name = currentTemplateName();
        payload.image = imageFile
          ? await readFileAsDataUrl(imageFile)
          : currentImageDataUrl;
        payload.x = String(Math.round(rect.x));
        payload.y = String(Math.round(rect.y));
        payload.w = String(Math.round(rect.w));
        payload.h = String(Math.round(rect.h));
        payload.fontsize = String(Math.round(fontSize));
        payload.rotation = String(Math.round(rotation));
        payload.color = inputs.color.value || "#000000";
        payload.align = textAlign;
        payload.valign = textValign;
        payload.orientation = orientation;
        payload.bold = textStyles.bold;
        payload.italic = textStyles.italic;
        payload.underline = textStyles.underline;
        payload.strikethrough = textStyles.strikethrough;
        payload.default = previewTextInput.value;
        if (currentFontValue()) {
          payload.font = currentFontValue();
        }

        try {
          const data = await pluginApiPost("editor/save", payload);
          if (data.status === "error") {
            throw new Error(data.message || "Failed to save template.");
          }
          setStatus(`Saved template: ${data.template}`, "ok");
        } catch (error) {
          setStatus(error.message || "Failed to save template.", "error");
        } finally {
          updateSaveState();
        }
      });

      initFontControls();
      initIconControls();
      setTemplateMode("new");
      fitTextHeight();
      draw();
      resetHistory();
      loadTemplates();
    </script>
  </body>
</html>
